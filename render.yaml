services:
  - type: web
    name: synergyx-backend
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    preDeployCommand: alembic upgrade head
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health/ready
    autoDeploy: false
    envVars:
      - key: APP_ENV
        value: production
      - key: APP_NAME
        value: SYNERGYX API
      - key: API_V1_PREFIX
        value: /api/v1
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: JWT_ALGORITHM
        value: HS256
      - key: JWT_ACCESS_TOKEN_EXPIRE_MINUTES
        value: 30
      - key: JWT_ISSUER
        value: synergyx-api
      - key: JWT_AUDIENCE
        value: synergyx-client
      - key: CORS_ORIGINS
        sync: false
      - key: STORAGE_BACKEND
        value: supabase
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: SUPABASE_STORAGE_BUCKET
        value: utility-documents
      - key: AI_PROVIDER
        value: rules
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENAI_MODEL
        sync: false
      - key: AI_REQUEST_TIMEOUT_SECONDS
        value: 20
      - key: MAX_UPLOAD_SIZE_MB
        value: 10
      - key: LOG_LEVEL
        value: INFO
